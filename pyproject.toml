[project]
name = "qd-service-control"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ulrik Pedersen", email = "ukp@observatorysciences.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "dbus-fast>=5,<6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "softioc>=4.7.2,<5",
]

[project.scripts]
qd-service-control = "qd_service_control:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aioca>=2.1,<3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.17.1",
    "scdemo",
    "ty==0.0.89",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
# target-version comes from requires-python.
src = ["src", "tests", "teststack/src", "teststack/tests"]

[tool.ruff.lint]
# Ruff's default set already covers most asyncio pitfalls (ASYNC1xx/2xx
# blocking calls, BLE001/E722 swallowed exceptions incl. CancelledError,
# PLE1142, B023). A project ruff config replaces ~/.config/ruff/ruff.toml,
# so its extras are repeated here.
extend-select = [
  "RUF006",   # asyncio-dangling-task: keep a reference to create_task() results
  "ASYNC109", # async function with a timeout parameter: use asyncio.timeout()
  "ASYNC110", # busy-wait sleep loop: use an asyncio.Event
  "TRY400",   # logging.error() in except: use logging.exception()
  "PGH003",   # blanket "type: ignore" without rule codes
  "B904",     # raise ... from err inside except
  "ANN",      # annotations, so ty can check call sites
  "PT",       # pytest style
  "TID252",   # absolute imports only
]
ignore = [
  "ANN401", # Any is sometimes the honest type (softioc/aioca values)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"teststack/tests/**" = ["ANN"]

[tool.ty.environment]
# Developed on macOS, deployed on EL9: check against Linux stubs.
python-platform = "linux"

[tool.ty.terminal]
error-on-warning = true

[tool.uv.workspace]
members = ["teststack"]

[tool.uv.sources]
scdemo = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "teststack/tests"]
asyncio_mode = "strict"
filterwarnings = ["error"]
addopts = "--import-mode=importlib"
markers = [
  "container: integration tests in the Rocky 9 systemd container (need QDSC_CONTAINER=1)",
]

[tool.uv.extra-build-dependencies]
softioc = [{ requirement = "epicscorelibs", match-runtime = true }]
